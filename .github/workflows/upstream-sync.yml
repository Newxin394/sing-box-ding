name: Upstream sync

# Two fork-maintenance checks that nothing else in this repository performs:
#
# 1. ding-sync    -- protocol/http/ding.go is a vendored copy of sagernet/sing's
#                    protocol/http/client.go. Bumping the sing dependency does
#                    NOT make it fail to compile when upstream changes the
#                    handshake, so the copy can silently lose an upstream fix.
#                    scripts/check-ding-sync.sh performs the comparison.
# 2. upstream-drift -- reports how far this fork has moved away from
#                    CHIZI-0618/sing-box's ebpf-inbound. Report only: the point
#                    is to make the drift a number instead of a feeling, not to
#                    block anything. The job fails only when the two histories
#                    no longer share an ancestor at all, because that is the one
#                    case where the number it prints would be meaningless.
#
# Branch names here go stale silently, so they are checked by hand whenever the
# fork or upstream renames a branch: this fork has a single maintenance branch
# (tc-rewrite-clean), and upstream renamed testing-ebpf-tc-rewrite to ebpf-inbound.
on:
  push:
    branches:
      - tc-rewrite-clean
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'protocol/http/ding.go'
      - 'scripts/check-ding-sync.sh'
      - '.github/workflows/upstream-sync.yml'
  pull_request:
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'protocol/http/ding.go'
      - 'scripts/check-ding-sync.sh'
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ding-sync:
    name: Vendored ding.go is in sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ~1.26
      - name: Download the pinned sing module
        run: go mod download github.com/sagernet/sing
      - name: Compare ding.go against upstream client.go
        run: sh scripts/check-ding-sync.sh --check

  upstream-drift:
    name: Report drift from upstream
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0
      - name: Compare with CHIZI-0618/sing-box
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/CHIZI-0618/sing-box.git
          git fetch --quiet upstream ebpf-inbound
          BASE=$(git merge-base HEAD upstream/ebpf-inbound) || {
            echo "::error::no common ancestor between HEAD and upstream/ebpf-inbound; upstream history was rewritten and this report is meaningless until the fork is rebased onto it"
            exit 1
          }
          {
            echo "### Upstream drift (CHIZI-0618/sing-box ebpf-inbound)"
            echo
            echo "- ahead of upstream: $(git rev-list --count "$BASE"..HEAD)"
            echo "- behind upstream:  $(git rev-list --count "$BASE"..upstream/ebpf-inbound)"
            echo
            echo '```'
            git diff --shortstat "$BASE" upstream/ebpf-inbound || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
